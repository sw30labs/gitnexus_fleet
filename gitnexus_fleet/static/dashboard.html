<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitNexus Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #080b0f;
    --surface:  #0d1117;
    --surface2: #131920;
    --border:   #1e2d3d;
    --accent:   #00d4ff;
    --accent2:  #00ff88;
    --warn:     #ff6b35;
    --dim:      #4a6278;
    --text:     #c9d8e8;
    --muted:    #3d5468;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    overflow: hidden;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ── Layout ── */
  .shell {
    display: grid;
    grid-template-rows: 52px 1fr;
    grid-template-columns: 260px 1fr;
    height: 100vh;
  }

  /* ── Topbar ── */
  .topbar {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
  }

  .topbar-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.05em;
    color: var(--accent);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .topbar-logo svg { width: 20px; height: 20px; }

  .topbar-sep { flex: 1; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.4s;
    box-shadow: 0 0 0 0 transparent;
  }
  .status-dot.live {
    background: var(--accent2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%  { box-shadow: 0 0 0 0 rgba(0,255,136,0.4); }
    70% { box-shadow: 0 0 0 6px rgba(0,255,136,0); }
    100%{ box-shadow: 0 0 0 0 rgba(0,255,136,0);   }
  }

  .status-label { color: var(--dim); font-size: 11px; letter-spacing: 0.08em; }

  .repo-count { color: var(--accent); font-weight: 700; font-size: 13px; }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-head {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-head span {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .repo-filter {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 6px 10px;
    width: 100%;
    margin: 10px 12px;
    width: calc(100% - 24px);
    outline: none;
    transition: border-color 0.2s;
  }
  .repo-filter:focus { border-color: var(--accent); }
  .repo-filter::placeholder { color: var(--muted); }

  .repo-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .repo-list::-webkit-scrollbar { width: 4px; }
  .repo-list::-webkit-scrollbar-track { background: transparent; }
  .repo-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .repo-item {
    padding: 8px 14px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .repo-item:hover { background: var(--surface2); border-left-color: var(--accent); }
  .repo-item.active { background: rgba(0,212,255,0.06); border-left-color: var(--accent); }
  .repo-item.active .repo-name { color: var(--accent); }

  .repo-item-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .repo-item-dot.ok    { background: var(--accent2); }
  .repo-item-dot.error { background: var(--warn); }
  .repo-item-dot.wait  { background: var(--muted); }

  .repo-name {
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .sidebar-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .sidebar-footer .stat { font-size: 10px; color: var(--dim); }
  .sidebar-footer .stat span { color: var(--accent2); font-weight: 600; }

  /* ── Main panel ── */
  .main {
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  .query-panel {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 16px 20px;
  }

  .panel-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 12px;
  }

  /* Predefined queries */
  .predef-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .predef-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .predef-btn .key {
    font-size: 10px;
    background: var(--border);
    border-radius: 2px;
    padding: 1px 4px;
    color: var(--dim);
  }
  .predef-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.05);
  }
  .predef-btn.impact:hover   { border-color: var(--warn);   color: var(--warn);   background: rgba(255,107,53,0.05); }
  .predef-btn.search:hover   { border-color: var(--accent2); color: var(--accent2); background: rgba(0,255,136,0.05); }

  /* Custom query */
  .query-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .query-mode-tabs {
    display: flex;
    gap: 1px;
    background: var(--border);
    border-radius: 4px;
    padding: 1px;
    margin-bottom: 8px;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--surface2);
    color: var(--accent);
  }

  .query-input-wrap { flex: 1; }

  .query-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 12px;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  .query-input:focus { border-color: var(--accent); }
  .query-input::placeholder { color: var(--muted); }

  .run-btn {
    background: var(--accent);
    border: none;
    color: var(--bg);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 0 20px;
    height: 38px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-end;
  }
  .run-btn:hover { background: #33ddff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,212,255,0.3); }
  .run-btn:active { transform: translateY(0); }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .target-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .target-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .target-input:focus { border-color: var(--warn); }
  .direction-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    cursor: pointer;
  }

  /* ── Results ── */
  .results-panel {
    overflow-y: auto;
    padding: 20px;
    background: var(--bg);
  }
  .results-panel::-webkit-scrollbar { width: 6px; }
  .results-panel::-webkit-scrollbar-track { background: transparent; }
  .results-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .results-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .results-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  .results-meta { font-size: 11px; color: var(--dim); }
  .results-clear {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .results-clear:hover { border-color: var(--warn); color: var(--warn); }

  .result-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 16px;
    overflow: hidden;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: none; } }

  .result-block-head {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .result-block-tag {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 2px;
  }
  .tag-query   { background: rgba(0,212,255,0.12); color: var(--accent); }
  .tag-impact  { background: rgba(255,107,53,0.12); color: var(--warn);   }
  .tag-context { background: rgba(0,255,136,0.12); color: var(--accent2); }
  .tag-cypher  { background: rgba(160,100,255,0.12); color: #a064ff; }
  .tag-ask     { background: rgba(255,210,50,0.12); color: #ffd232; }
  .tag-error   { background: rgba(255,50,50,0.12);  color: #ff5050; }

  .ask-summary { margin-bottom: 14px; line-height: 1.8; }
  .ask-detail  { margin-top: 10px; }
  .ask-detail summary {
    cursor: pointer; color: var(--dim); font-size: 11px;
    letter-spacing: 0.06em; padding: 4px 0;
  }
  .ask-detail summary:hover { color: var(--accent); }
  .ask-detail pre {
    margin-top: 8px; padding: 10px; font-size: 11px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; max-height: 300px; overflow-y: auto;
  }
  .ask-meta {
    font-size: 11px; color: var(--dim); margin-bottom: 10px;
    padding: 6px 10px; background: var(--bg); border-radius: 3px;
    border-left: 2px solid #ffd232;
  }

  .result-block-label { font-size: 11px; color: var(--dim); font-style: italic; }
  .result-block-time  { margin-left: auto; font-size: 10px; color: var(--muted); }

  .result-block-body {
    padding: 14px;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
    max-height: 500px;
    overflow-y: auto;
    line-height: 1.7;
  }
  .result-block-body::-webkit-scrollbar { width: 4px; }
  .result-block-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .result-block-body .key   { color: var(--accent);  }
  .result-block-body .val   { color: var(--accent2); }
  .result-block-body .num   { color: #ff9944; }
  .result-block-body .str   { color: #aaffaa; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  .empty-state p    { font-size: 12px; line-height: 2; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 4px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>

<div class="shell">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="5"  cy="12" r="2.5"/>
        <circle cx="19" cy="5"  r="2.5"/>
        <circle cx="19" cy="19" r="2.5"/>
        <line x1="7"  y1="11" x2="17" y2="6.5"/>
        <line x1="7"  y1="13" x2="17" y2="17.5"/>
      </svg>
      GitNexus Fleet
    </div>
    <span class="topbar-sep"></span>
    <div id="statusDot" class="status-dot"></div>
    <span id="statusLabel" class="status-label">connecting</span>
    <span id="repoCount" class="repo-count"></span>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <span>Repositories</span>
    </div>
    <input class="repo-filter" id="repoFilter" type="text" placeholder="filter repos...">
    <div class="repo-list" id="repoList">
      <div style="padding:14px;color:var(--muted);font-size:11px;">Loading...</div>
    </div>
    <div class="sidebar-footer">
      <div class="stat">indexed: <span id="indexedCount">0</span></div>
      <div class="stat" style="margin-left:auto;">errors: <span id="errorCount" style="color:var(--warn)">0</span></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Query panel -->
    <div class="query-panel">
      <div class="panel-label">Query Interface</div>

      <!-- Mode tabs -->
      <div class="query-mode-tabs">
        <button class="tab-btn active" data-mode="ask"     onclick="setMode('ask')">Ask</button>
        <button class="tab-btn"        data-mode="search"  onclick="setMode('search')">Search</button>
        <button class="tab-btn"        data-mode="impact"  onclick="setMode('impact')">Impact</button>
        <button class="tab-btn"        data-mode="context" onclick="setMode('context')">Context</button>
        <button class="tab-btn"        data-mode="cypher"  onclick="setMode('cypher')">Cypher</button>
        <button class="tab-btn"        data-mode="repos"   onclick="setMode('repos')">Repos</button>
      </div>

      <!-- Predefined queries -->
      <div class="predef-grid">
        <button class="predef-btn search"  onclick="runPredef('auth')">      <span class="key">1</span> Auth flows</button>
        <button class="predef-btn search"  onclick="runPredef('entry')">     <span class="key">2</span> Entry points</button>
        <button class="predef-btn search"  onclick="runPredef('database')">  <span class="key">3</span> DB layer</button>
        <button class="predef-btn search"  onclick="runPredef('error')">     <span class="key">4</span> Error handling</button>
        <button class="predef-btn impact"  onclick="runPredef('blast')">     <span class="key">5</span> Blast radius</button>
        <button class="predef-btn"         onclick="runPredef('clusters')">  <span class="key">6</span> Clusters</button>
        <button class="predef-btn"         onclick="runPredef('deps')">      <span class="key">7</span> Dependencies</button>
        <button class="predef-btn"         onclick="runPredef('listRepos')"> <span class="key">8</span> All repos</button>
      </div>

      <!-- Mode: Ask (natural language) -->
      <div id="modeAsk">
        <div class="query-row">
          <div class="query-input-wrap">
            <textarea class="query-input" id="askInput" rows="2"
              placeholder="Ask anything about your code... e.g. &quot;What are the main entry points?&quot; or &quot;Show me everything that calls authenticate&quot;"></textarea>
          </div>
          <button class="run-btn" onclick="runAsk()" style="background:#ffd232;color:#000">ASK</button>
        </div>
      </div>

      <!-- Mode: Search -->
      <div id="modeSearch" style="display:none">
        <div class="query-row">
          <div class="query-input-wrap">
            <textarea class="query-input" id="searchInput" rows="2"
              placeholder="authentication middleware, database connection, error handling..."></textarea>
          </div>
          <button class="run-btn" onclick="runSearch()">RUN</button>
        </div>
      </div>

      <!-- Mode: Impact -->
      <div id="modeImpact" style="display:none">
        <div class="target-row">
          <input class="target-input" id="impactTarget" type="text"
            placeholder="Symbol name, e.g. UserService, validate, AuthController">
          <select class="direction-select" id="impactDirection">
            <option value="upstream">↑ upstream (what uses this)</option>
            <option value="downstream">↓ downstream (what this uses)</option>
            <option value="both">↕ both</option>
          </select>
          <button class="run-btn" onclick="runImpact()" style="background:var(--warn)">RUN</button>
        </div>
      </div>

      <!-- Mode: Context -->
      <div id="modeContext" style="display:none">
        <div class="query-row">
          <div class="query-input-wrap">
            <input class="query-input" id="contextTarget" type="text" style="height:38px"
              placeholder="Symbol name for 360° context, e.g. validateUser">
          </div>
          <button class="run-btn" onclick="runContext()" style="background:var(--accent2);color:#000">RUN</button>
        </div>
      </div>

      <!-- Mode: Cypher -->
      <div id="modeCypher" style="display:none">
        <div class="query-row">
          <div class="query-input-wrap">
            <textarea class="query-input" id="cypherInput" rows="3"
              placeholder="MATCH (n:Function)-[r:CodeRelation {type:'CALLS'}]->(m) RETURN n.name, m.name LIMIT 20"></textarea>
          </div>
          <button class="run-btn" onclick="runCypher()" style="background:#a064ff">RUN</button>
        </div>
      </div>

      <!-- Mode: Repos -->
      <div id="modeRepos" style="display:none">
        <button class="run-btn" onclick="runListRepos()">LIST ALL INDEXED REPOS</button>
      </div>
    </div>

    <!-- Results -->
    <div class="results-panel" id="resultsPanel">
      <div class="empty-state" id="emptyState">
        <div class="big">◈</div>
        <p>Select a repo and run a query.<br>
           Use predefined shortcuts or write custom Cypher.<br>
           <span style="color:var(--dim)">Results appear here.</span></p>
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let selectedRepo = null;
let allRepos     = [];
let currentMode  = 'ask';

// ── Init ───────────────────────────────────────────────────────────────────────
async function init() {
  await checkHealth();
  await loadRepos();
  setInterval(checkHealth, 5000);
  setInterval(loadRepos,   15000);

  // Enter to submit ask
  document.getElementById('askInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runAsk(); }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    const map = {'1':'auth','2':'entry','3':'database','4':'error','5':'blast','6':'clusters','7':'deps','8':'listRepos'};
    if (map[e.key]) runPredef(map[e.key]);
  });
}

// ── Health check ──────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    const dot = document.getElementById('statusDot');
    const lbl = document.getElementById('statusLabel');
    if (d.mcp_ready) {
      dot.className = 'status-dot live';
      lbl.textContent = 'mcp · live';
      lbl.style.color = 'var(--accent2)';
    } else {
      dot.className = 'status-dot';
      lbl.textContent = 'mcp · loading';
      lbl.style.color = 'var(--warn)';
    }
  } catch(e) {
    document.getElementById('statusLabel').textContent = 'offline';
  }
}

// ── Load repos ────────────────────────────────────────────────────────────────
async function loadRepos() {
  try {
    const r = await fetch('/api/repos');
    const d = await r.json();
    allRepos = d.repos || [];
    renderRepos(allRepos);

    const indexed = allRepos.filter(r => r.indexed).length;
    const errors  = allRepos.filter(r => r.error).length;
    document.getElementById('indexedCount').textContent = indexed;
    document.getElementById('errorCount').textContent   = errors;
    document.getElementById('repoCount').textContent    = `${indexed} repos`;
  } catch(e) {}
}

function renderRepos(repos) {
  const list = document.getElementById('repoList');
  if (!repos.length) {
    list.innerHTML = '<div style="padding:14px;color:var(--muted);font-size:11px;">No repos found</div>';
    return;
  }
  list.innerHTML = repos.map(r => `
    <div class="repo-item ${selectedRepo === r.name ? 'active' : ''}" onclick="selectRepo('${r.name}')">
      <div class="repo-item-dot ${r.indexed ? 'ok' : r.error ? 'error' : 'wait'}"></div>
      <span class="repo-name" title="${r.name}">${r.name}</span>
    </div>
  `).join('');
}

document.getElementById('repoFilter').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderRepos(allRepos.filter(r => r.name.toLowerCase().includes(q)));
});

function selectRepo(name) {
  selectedRepo = name;
  renderRepos(allRepos.filter(r => {
    const q = document.getElementById('repoFilter').value.toLowerCase();
    return r.name.toLowerCase().includes(q);
  }));
  showToast(`Repo: ${name}`);
}

// ── Mode tabs ─────────────────────────────────────────────────────────────────
const MODES = ['ask','search','impact','context','cypher','repos'];
function setMode(m) {
  currentMode = m;
  MODES.forEach(mode => {
    document.getElementById('mode' + capitalize(mode)).style.display = mode === m ? '' : 'none';
    document.querySelector(`[data-mode="${mode}"]`).classList.toggle('active', mode === m);
  });
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ── Predefined queries ────────────────────────────────────────────────────────
const PREDEFS = {
  auth:      { mode:'search',  fn: () => runApiSearch('authentication authorization login token JWT') },
  entry:     { mode:'search',  fn: () => runApiSearch('main entry point init startup bootstrap') },
  database:  { mode:'search',  fn: () => runApiSearch('database query repository connection pool') },
  error:     { mode:'search',  fn: () => runApiSearch('error handling exception retry fallback') },
  blast:     { mode:'cypher',  fn: () => runApiCypher(
    `MATCH (caller)-[r:CodeRelation {type:'CALLS'}]->(fn)
WHERE r.confidence > 0.7
RETURN fn.name AS symbol, fn.filePath AS file, count(caller) AS callers
ORDER BY callers DESC LIMIT 20`, 'Blast Radius (Top 20)') },
  clusters: { mode:'cypher',  fn: () => runApiCypher(
    `MATCH (c:Community)
RETURN c.heuristicLabel AS cluster, c.size AS members, c.cohesion AS cohesion
ORDER BY members DESC LIMIT 30`, 'Functional Clusters') },
  deps:     { mode:'cypher',  fn: () => runApiCypher(
    `MATCH (a:File)-[r:CodeRelation {type:'IMPORTS'}]->(b:File)
RETURN a.filePath AS importer, b.filePath AS imported, count(r) AS connections
ORDER BY connections DESC LIMIT 30`, 'File Dependencies') },
  listRepos:{ mode:'repos',   fn: () => runApiListRepos() },
};

function runPredef(key) {
  const p = PREDEFS[key];
  if (!p) return;
  setMode(p.mode);
  p.fn();
}

// ── Ask (natural language) ─────────────────────────────────────────

async function runAsk() {
  const q = document.getElementById('askInput').value.trim();
  if (!q) return;
  hideEmpty();
  const blockId = 'block_' + Date.now();
  const startMs = Date.now();
  appendBlock(blockId, 'ask', q, '<span class="spinner"></span> thinking...');

  try {
    const r = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, repo: selectedRepo }),
    });
    const d = await r.json();
    const elapsed = ((Date.now() - startMs) / 1000).toFixed(2) + 's';

    if (d.error) {
      let errMsg = d.error;
      if (d.explanation) errMsg = d.explanation + '\n\n' + errMsg;
      updateBlock(blockId, 'error', errMsg, elapsed);
    } else {
      const body = document.getElementById(blockId + '_body');
      const time = document.getElementById(blockId + '_time');
      if (time) time.textContent = elapsed;

      let html = '';
      if (d.explanation) {
        html += `<div class="ask-meta">Tool: <strong>${escHtml(d.tool)}</strong> — ${escHtml(d.explanation)}</div>`;
      }
      html += `<div class="ask-summary">${formatSummary(d.summary)}</div>`;
      html += `<details class="ask-detail"><summary>Raw result</summary><pre>${escHtml(d.raw || '(empty)')}</pre></details>`;
      body.innerHTML = html;
    }
  } catch(e) {
    updateBlock(blockId, 'error', 'Network error: ' + e.message, '');
  }
}

function formatSummary(text) {
  if (!text) return '';
  return escHtml(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code style="background:var(--surface2);padding:1px 5px;border-radius:3px;color:var(--accent)">$1</code>')
    .replace(/^- (.+)$/gm, '• $1')
    .replace(/\n/g, '<br>');
}

// ── API calls ─────────────────────────────────────────────────────────────────

async function runSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  await runApiSearch(q);
}

async function runImpact() {
  const t = document.getElementById('impactTarget').value.trim();
  const d = document.getElementById('impactDirection').value;
  if (!t) return;
  await runApiCall('/api/impact', { target: t, direction: d, repo: selectedRepo }, 'impact', `${d}: ${t}`);
}

async function runContext() {
  const t = document.getElementById('contextTarget').value.trim();
  if (!t) return;
  await runApiCall('/api/context', { name: t, repo: selectedRepo }, 'context', `context: ${t}`);
}

async function runCypher() {
  const q = document.getElementById('cypherInput').value.trim();
  if (!q) return;
  await runApiCypher(q);
}

async function runListRepos() {
  await runApiListRepos();
}

// ── Core runners ──────────────────────────────────────────────────────────────

async function runApiSearch(query, label) {
  const args = { query };
  if (selectedRepo) args.repo = selectedRepo;
  await runApiCall('/api/query', args, 'query', label || query);
}

async function runApiCypher(cypher, label) {
  const args = { cypher };
  if (selectedRepo) args.repo = selectedRepo;
  await runApiCall('/api/cypher', args, 'cypher', label || cypher.split('\n')[0].slice(0, 60));
}

async function runApiListRepos() {
  await runApiCall('/api/list_repos', {}, 'query', 'list all repos');
}

async function runApiCall(endpoint, body, tag, label) {
  hideEmpty();
  const blockId = 'block_' + Date.now();
  const startMs = Date.now();
  appendBlock(blockId, tag, label, '<span class="spinner"></span> running...');

  try {
    const r = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    const elapsed = ((Date.now() - startMs) / 1000).toFixed(2) + 's';

    if (d.error) {
      updateBlock(blockId, 'error', d.error, elapsed);
    } else {
      updateBlock(blockId, tag, d.result || '(empty)', elapsed);
    }
  } catch(e) {
    updateBlock(blockId, 'error', 'Network error: ' + e.message, '');
  }
}

// ── Result blocks ──────────────────────────────────────────────────────────────

function hideEmpty() {
  const e = document.getElementById('emptyState');
  if (e) e.style.display = 'none';
}

function appendBlock(id, tag, label, body) {
  const panel = document.getElementById('resultsPanel');
  const div = document.createElement('div');
  div.className = 'result-block';
  div.id = id;
  div.innerHTML = `
    <div class="result-block-head">
      <span class="result-block-tag tag-${tag}">${tag}</span>
      <span class="result-block-label">${escHtml(label)}</span>
      ${selectedRepo ? `<span style="color:var(--accent2);font-size:11px;margin-left:8px;">· ${selectedRepo}</span>` : '<span style="color:var(--muted);font-size:11px;margin-left:8px;">· all repos</span>'}
      <span class="result-block-time" id="${id}_time"></span>
    </div>
    <div class="result-block-body" id="${id}_body">${body}</div>
  `;
  panel.insertBefore(div, panel.firstChild.nextSibling || panel.firstChild);
  panel.scrollTop = 0;
}

function updateBlock(id, tag, text, elapsed) {
  const body = document.getElementById(id + '_body');
  const time = document.getElementById(id + '_time');
  const head = document.querySelector(`#${id} .result-block-head`);
  const tagEl = head.querySelector('.result-block-tag');

  tagEl.className = `result-block-tag tag-${tag}`;
  tagEl.textContent = tag;
  if (time) time.textContent = elapsed;
  if (body) body.textContent = text;
}

function clearResults() {
  const panel = document.getElementById('resultsPanel');
  const blocks = panel.querySelectorAll('.result-block');
  blocks.forEach(b => b.remove());
  document.getElementById('emptyState').style.display = '';
}

// ── Utilities ──────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Boot ───────────────────────────────────────────────────────────────────────
init();
</script>
